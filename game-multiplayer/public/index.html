<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐍Óia a cobra🐍</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Tela Inicial -->
  <div id="loginOverlay" class="overlay">
    <div class="modal-box">
      <h1>🐍Óia a cobra🐍</h1>
      <p>Coma orbes para crescer e faça os rivais baterem no seu corpo!</p>
      <form id="joinForm">
        <input
          type="text"
          id="nicknameInput"
          placeholder="Seu nickname..."
          maxlength="14"
          autocomplete="off"
          required
          autofocus
        />
        <button type="submit">Jogar Agora</button>
      </form>
    </div>
  </div>

  <!-- Tela de Fim de Jogo -->
  <div id="gameOverOverlay" class="overlay hidden">
    <div class="modal-box danger">
      <h2>Fim de Jogo!</h2>
      <p id="deathReason">Você foi eliminado.</p>
      <div class="final-score">Pontuação final: <strong id="finalScore">0</strong></div>
      <button id="respawnBtn">Jogar Novamente</button>
    </div>
  </div>

  <!-- Arena e HUD -->
  <div class="game-wrapper">
    <canvas id="gameCanvas" width="900" height="620"></canvas>

    <aside class="hud-panel">
      <h2>Ranking</h2>
      <ul id="scoreList"></ul>
      <div class="controls">
        <p><strong>Direção:</strong> Mova o Mouse ou use <strong>A / D</strong> (Setas)</p>
        <p><strong>Turbo:</strong> Segure <strong>Clique</strong> ou <strong>Espaço</strong></p>
      </div>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
